[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helmreview"
dynamic = ["version"]
description = "Review Helm charts and Kubernetes manifests with helm lint, static security checks and a local Ollama model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Wiebe Klijnsma" }]
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
helmreview = "helmreview.cli:main"

[tool.setuptools.dynamic]
# Single source of truth: `make release` bumps __version__ only.
version = { attr = "helmreview.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"helmreview.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
